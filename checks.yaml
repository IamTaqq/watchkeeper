# Your checks. Terraform creates one CloudWatch alarm per check.
# The demo checks (demo-app-health, demo-data-freshness, demo-cron) are added
# automatically while enable_demo = true, so this list can start empty.
#
# Common options for every check:
#   name               lowercase letters, digits, hyphens (unique)
#   type               http | heartbeat | http_json_freshness | postgres
#   description        shown in the alert
#   failure_threshold  consecutive failed runs before alerting (default 2)
#
# After editing, run `make validate` and then `make deploy`.

checks: []

