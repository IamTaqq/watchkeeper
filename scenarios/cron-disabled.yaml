name: cron-disabled
description: A job silently stops because its schedule was disabled. No errors anywhere; only an absence.
now: "2026-10-20T09:00:00Z"

alarm:
  check: demo-cron
  description: Practice cron job runs every 5 minutes
  reason: "Threshold Crossed: 1 datapoint [0.0] was less than the threshold (1.0)."

checks:
  - {name: demo-app-health, type: http, ok: true, message: "HTTP 200 in 130 ms"}
  - {name: demo-data-freshness, type: http_json_freshness, ok: true, message: "'last_updated' is 3s old"}
  - {name: demo-cron, type: heartbeat, ok: false, message: "last heartbeat 1260s ago (expected every 300s)"}

history:
  demo-cron:
    - {from: -120, to: -15, success: true, latency_ms: 20}
    - {from: -14, to: 0, success: false, latency_ms: 20}
  demo-app-health:
    - {from: -120, to: 0, success: true, latency_ms: 130}

logs:
  demo-cron:
    - {every: 5, from: -121, to: -21, message: "INFO demo job finished, reported ok"}
  demo-app:
    - {every: 5, from: -120, to: 0, message: "INFO GET /health 200 11ms"}
  checker:
    - {every: 1, from: -14, to: 0, message: '{"check": "demo-cron", "status": "FAIL", "message": "last heartbeat overdue"}'}

heartbeats:
  demo-cron: {status: ok, last_ping: -21, message: ""}

changes:
  - {at: -22, actor: "takumi (console)", action: DisableRule, target: watchkeeper-demo-cron, details: "events.amazonaws.com"}

context:
  jobs: [demo-cron]
  schedules: [watchkeeper-demo-cron]
  deployments: [dpl_104]
  flags: []

expected:
  root_cause: ["disabl|schedule|rule"]
  tier: action
  action: resume_schedule
  params: {schedule: watchkeeper-demo-cron}
